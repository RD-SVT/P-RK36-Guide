<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<title>P-RK36 3D Explorer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
/* Layout: full-bleed 3D stage; floating service-manual panels (header, parts index, control bar, detail drawer) */
:root{
  /* same tokens as Can Database (CDB) — light only */
  --bg:#f7f7f6; --scene:#efefed; --floor-tint:#ffffff;
  --panel:#ffffff; --panel-solid:#ffffff;
  --fg:#171717; --muted:#737373; --t2:#525252; --line:rgba(23,23,23,.08); --line2:rgba(23,23,23,.14); --chip:#f1f1f0;
  --accent:#C8102E; --accent-fg:#ffffff; --blue:#171717;
  --shadow:0 8px 24px rgba(0,0,0,.06);
  --f-display:"IBM Plex Sans Thai","IBM Plex Sans",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai","IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
}
html,body{height:100%}
body{margin:0;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#app{position:fixed;inset:0}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#c.grabbing{cursor:grabbing}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}

/* header */
.hdr{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));padding:12px 16px 12px 14px;display:flex;gap:12px;align-items:stretch;max-width:calc(100% - 32px)}
.hdr-tag{width:32px;height:32px;border-radius:8px;background:var(--accent);color:#fff;font-size:17px;font-weight:600;display:flex;align-items:center;justify-content:center;flex:none;align-self:center}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:0;color:var(--muted)}
.hdr h1{margin:2px 0 0;font-family:var(--f-mono);font-weight:500;font-size:18px;line-height:24px}
.hdr p{margin:4px 0 0;color:var(--muted);font-size:13px}

/* spec button top-right */
.top-right{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:8px;align-items:center}
.stat{font-family:var(--f-mono);font-size:12px;padding:8px 12px;display:flex;gap:14px;font-variant-numeric:tabular-nums}
.stat b{font-weight:500}
.stat span{color:var(--muted)}

/* parts index */
.parts{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:calc(124px + env(safe-area-inset-top,0px));bottom:calc(92px + env(safe-area-inset-bottom,0px));width:268px;display:flex;flex-direction:column;overflow:hidden}
.parts-head{display:flex;justify-content:space-between;align-items:baseline;padding:12px 14px 8px;border-bottom:1px solid var(--line)}
.parts-head .eyebrow{white-space:nowrap}
.parts-head h2{margin:0;font-size:15px;font-weight:600}
.parts-list{overflow-y:auto;padding:6px 6px 10px;flex:1;min-height:0}
.zone{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:10px 8px 4px}
.part-btn{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:center;width:100%;text-align:left;background:none;border:0;border-radius:7px;padding:6px 8px;cursor:pointer}
.part-btn:hover{background:var(--chip)}
.part-btn[aria-current="true"]{background:var(--chip);box-shadow:inset 2px 0 0 var(--accent)}
.part-btn[aria-current="true"] .part-no{background:var(--accent);border-color:var(--accent);color:#fff}
.part-no{font-family:var(--f-mono);font-size:11px;font-weight:500;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line2);color:var(--t2);font-variant-numeric:tabular-nums}
.part-txt{min-width:0;line-height:1.3}
.part-txt b{display:block;font-weight:500;font-size:13px}
.part-txt small{display:block;color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* control bar */
.bar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));max-width:calc(100% - 32px);display:flex;gap:6px;align-items:center;padding:6px;overflow-x:auto;scrollbar-width:none}
.bar::-webkit-scrollbar{display:none}
.sep{width:1px;align-self:stretch;background:var(--line);margin:4px 2px;flex:none}
a.btn{color:var(--fg)}
.btn{flex:none;display:inline-flex;text-decoration:none;align-items:center;gap:6px;border:1px solid transparent;background:none;border-radius:8px;padding:0 12px;height:32px;cursor:pointer;white-space:nowrap;font-size:13px}
.btn:hover{background:var(--chip)}
.btn small{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);letter-spacing:.03em}
.btn.primary{background:var(--accent);color:var(--accent-fg);font-weight:600}
.btn.primary small{color:inherit;opacity:.8}
.btn.primary:hover{filter:brightness(1.06);background:var(--accent)}
.btn[aria-pressed="true"]:not(.primary){background:var(--chip);border-color:var(--line2)}
.btn .ico{width:16px;height:16px;flex:none}
.only-mobile{display:none}

.hint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));font-size:12px;color:var(--muted);padding:5px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line);white-space:nowrap;transition:opacity .4s}

/* pins */
#pins{position:absolute;inset:0;pointer-events:none}
.pin{position:absolute;left:0;top:0;pointer-events:auto;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;border:2px solid #fff;background:var(--accent);color:#fff;font-family:var(--f-mono);font-size:11px;font-weight:500;display:grid;place-items:center;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.35);transition:opacity .25s, transform .15s;will-change:transform}
.pin::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:1.5px solid var(--accent);opacity:.35}
.pin.active{background:var(--blue)}
.pin.active::after{border-color:var(--blue)}
.pin-label{position:absolute;left:30px;top:50%;transform:translateY(-50%);background:var(--panel-solid);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-family:var(--f-body);font-size:12px;font-weight:500;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s}
.pin:hover .pin-label,.pin:focus-visible .pin-label{opacity:1}

/* drawer */
.drawer{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(92px + env(safe-area-inset-bottom,0px));width:min(400px,calc(100% - 32px));display:flex;flex-direction:column;overflow:hidden;transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .25s}
.drawer[hidden]{display:flex!important;transform:translateX(calc(100% + 24px));opacity:0;pointer-events:none}
.d-scroll{overflow-y:auto;padding:14px 16px 16px;flex:1;min-height:0}
.d-head{display:flex;justify-content:space-between;align-items:center;padding:10px 10px 10px 16px;border-bottom:1px solid var(--line)}
.icon-btn{width:32px;height:32px;border-radius:7px;border:0;background:none;cursor:pointer;font-size:20px;line-height:1;display:grid;place-items:center}
.icon-btn:hover{background:var(--chip)}
.d-title{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;margin-bottom:12px}
.d-no{font-family:var(--f-mono);font-weight:500;font-size:28px;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.d-title h2{margin:0;font-size:18px;font-weight:500;line-height:1.3;text-wrap:balance}
.d-en{margin:2px 0 0;font-size:13px;font-weight:400;color:var(--muted)}
.d-photo{margin:0 0 8px;border-radius:8px;overflow:hidden;background:var(--chip);border:1px solid var(--line)}
.d-photo img{display:block;width:100%;max-height:300px;object-fit:contain;background:#0c0f12}
.d-photo figcaption{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);padding:6px 10px;letter-spacing:.03em}
.thumbs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.thumbs button{width:52px;height:40px;padding:0;border-radius:5px;border:1.5px solid var(--line);overflow:hidden;cursor:pointer;background:var(--chip)}
.thumbs button[aria-current="true"]{border-color:var(--accent)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.d-body{margin:0 0 12px;font-size:14px;max-width:65ch}
.d-note{margin:0 0 12px;font-size:12px;color:var(--muted);padding:8px 10px;border-left:2px solid var(--line);background:var(--chip);border-radius:0 6px 6px 0}
.specs{width:100%;border-collapse:collapse;font-size:12.5px;margin:4px 0 12px}
.specs th{text-align:left;font-weight:400;color:var(--muted);padding:6px 8px 6px 0;vertical-align:top;border-bottom:1px solid var(--line);width:46%}
.specs th span{display:block;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.02em}
.specs td{font-family:var(--f-mono);padding:6px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;vertical-align:top}
.d-nav{display:flex;justify-content:space-between;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
.d-nav .btn{border:1px solid var(--line2)}

/* vend toast */
.toast{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(112px + env(safe-area-inset-bottom,0px));padding:9px 14px;font-size:13px;text-align:center;max-width:calc(100% - 32px);line-height:1.45}
.toast b{font-family:var(--f-mono);font-weight:500}
.toast small{color:var(--muted);font-size:11.5px}
.toast .hot{color:#d23a2a;font-weight:600}
.toast .cold{color:var(--blue);font-weight:600}
.d-body a,.d-note a{color:var(--accent)}
.cmp-h{font-family:var(--f-display);font-size:16px;font-weight:600;margin:14px 0 2px;letter-spacing:.02em}

/* loading */
#loading{position:absolute;inset:0;display:grid;place-items:center;background:var(--bg);z-index:5;transition:opacity .5s}
#loading.done{opacity:0;pointer-events:none}
.ld{text-align:center;padding:0 24px}
.ld b{display:block;font-family:var(--f-mono);font-size:18px;font-weight:500}
.ld span{color:var(--muted);font-size:13px}

/* loading: way out to Lite */
.ld span{display:block}
.ld-lite{margin-top:16px}
/* Lite mode (photo list, no 3D) */
html.is-lite{height:auto;overflow:auto}
html.is-lite body{height:auto;overflow:visible}
#lite{max-width:720px;margin:0 auto;padding:0 16px 48px}
.l-top{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;background:var(--bg);border-bottom:1px solid var(--line)}
.l-brand{display:flex;gap:12px;align-items:center;min-width:0}
.l-brand>div:last-child{min-width:0}
.l-brand .eyebrow{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.l-brand h1{margin:2px 0 0;font-family:var(--f-mono);font-weight:500;font-size:16px;line-height:20px}
.l-actions{display:flex;gap:8px;flex:none}
.l-list{display:flex;flex-direction:column;gap:12px;padding-top:16px}
.l-step{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;scroll-margin-top:76px}
.l-step.on{border-color:var(--accent);box-shadow:inset 2px 0 0 var(--accent)}
.l-head{display:flex;gap:12px;align-items:baseline}
.l-no{font-family:var(--f-mono);font-size:20px;font-weight:500;color:var(--accent);font-variant-numeric:tabular-nums}
.l-head h2{margin:0;font-size:16px;font-weight:500}
.l-head p{margin:0;font-size:13px;color:var(--muted)}
.l-body{margin:8px 0 0;font-size:14px}
.l-photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:12px}
.l-photos img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;background:var(--chip);display:block}
@media (max-width:1100px){
  .parts.dimmed{opacity:0;pointer-events:none}
}
@media (max-width:760px){
  .hdr{padding:8px 12px 8px 8px;max-width:calc(100% - 196px)}
  .hdr h1{font-size:15px;line-height:20px}
  #specBtn{display:none}
  .bar .btn[data-view],#pinsBtn,#samplesBtn,#spinBtn,.bar .sep{display:none}
  .bar{justify-content:center}
  #partsBtn{order:-1}
  .hdr p,.hdr .eyebrow{display:none}
  .top-right .stat{display:none}
  .only-mobile{display:inline-flex}
  .hint{display:none}
  .parts{top:auto;bottom:calc(74px + env(safe-area-inset-bottom,0px));width:auto;right:max(16px,env(safe-area-inset-right,0px));max-height:52%;transition:transform .3s, opacity .25s}
  .parts:not(.open){transform:translateY(20px);opacity:0;pointer-events:none}
  .drawer{top:auto;left:max(16px,env(safe-area-inset-left,0px));width:auto;bottom:calc(74px + env(safe-area-inset-bottom,0px));max-height:48%}
  .drawer[hidden]{transform:translateY(calc(100% + 90px))}
  .d-photo img{max-height:132px}
  .d-scroll{padding:12px 16px}
  .d-title{margin-bottom:8px}
  .d-no{font-size:22px}
  .d-title h2{font-size:16px}
  .bar{left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));transform:none;max-width:none}
}
@media (prefers-reduced-motion:reduce){
  .drawer,.parts{transition:none}
}
</style>

</head>
<body>
<div id="app">
  <canvas id="c" aria-label="โมเดล 3 มิติของตู้จำหน่ายเครื่องดื่ม P-RK36-HPAPER"></canvas>
  <div id="pins"></div>

  <header class="hdr panel">
    <div class="hdr-tag" aria-hidden="true">S</div>
    <div>
      <div class="eyebrow">SUN VENDING · คู่มือถ่ายรูป</div>
      <h1>P-RK36-HPAPER</h1>
      <p>Panasonic · ตู้กระป๋อง/ขวด 36 ช่อง</p>
    </div>
  </header>

  <div class="top-right">
    <div class="stat panel" aria-label="สเปกหลัก">
      <div><span>W×D×H </span><b>1185×731×1830</b><span> mm*</span></div>
      <div><b>275</b><span> kg</span></div>
      <div><b>1,693</b><span> L</span></div>
    </div>
    <button class="btn panel" id="specBtn" type="button">สเปก <small>SPECS</small></button>
    <button class="btn panel" id="liteBtn" type="button" onclick="setGuideMode('lite')">แบบรูป</button>
    <a class="btn panel" id="cdbBtn" href="https://rd-svt.github.io/Can-Database-CDB2/" title="กลับไปหน้า Can Database">← CDB</a>
  </div>

  <nav class="parts panel" id="parts" aria-label="ลำดับการถ่าย">
    <div class="parts-head"><h2>ลำดับการถ่าย</h2><span class="eyebrow" id="partsCount"></span></div>
    <div class="parts-list" id="partsList"></div>
  </nav>

  <div class="hint" id="hint">ลากเพื่อหมุน · เลื่อนเพื่อซูม · กดหมุดเพื่อดูวิธีถ่าย</div>
  <div class="toast panel" id="toast" hidden role="status"></div>

  <div class="bar panel" role="toolbar" aria-label="ควบคุมโมเดล">
    <button class="btn primary" id="doorBtn" type="button" aria-pressed="false">
      <svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 2h7v12H3z"/><path d="M10 3.5l3-1.2v11.4l-3-1.2"/><circle cx="8" cy="8.5" r=".6" fill="currentColor"/></svg>
      <span id="doorTxt">เปิดประตู</span> <small id="doorSub">OPEN</small>
    </button>
    <button class="btn" id="innerBtn" type="button" aria-pressed="false">ประตูใน <small>INNER</small></button>
    <span class="sep" aria-hidden="true"></span>
    <button class="btn" data-view="overview" type="button">ภาพรวม</button>
    <button class="btn" data-view="interior" type="button">ภายในตู้</button>
    <button class="btn" data-view="door_side" type="button">ด้านในประตู</button>
    <button class="btn" data-view="machine" type="button">ห้องเครื่อง</button>
    <span class="sep" aria-hidden="true"></span>
    <button class="btn" id="pinsBtn" type="button" aria-pressed="true">จุดข้อมูล</button>
    <button class="btn" id="samplesBtn" type="button" aria-pressed="true">สินค้าตัวอย่าง</button>
    <button class="btn" id="spinBtn" type="button" aria-pressed="false">หมุนอัตโนมัติ</button>
    <button class="btn only-mobile" id="partsBtn" type="button" aria-pressed="false" aria-controls="parts">ลำดับการถ่าย</button>
  </div>

  <aside class="drawer panel" id="drawer" hidden aria-live="polite"></aside>

  <div id="loading"><div class="ld"><b>P-RK36-HPAPER</b><span id="ldMsg">กำลังโหลดโมเดล 3D…</span><button class="btn panel ld-lite" type="button" onclick="setGuideMode('lite')">เน็ตช้า? ดูแบบรูป</button></div></div>
</div>

<main id="lite" hidden>
  <header class="l-top">
    <div class="l-brand"><div class="hdr-tag" aria-hidden="true">S</div><div><div class="eyebrow">SUN VENDING · คู่มือถ่ายรูป</div><h1>P-RK36-HPAPER</h1></div></div>
    <div class="l-actions"><button class="btn panel" id="to3d" type="button" onclick="setGuideMode('3d')">ดูแบบ 3D</button><a class="btn panel" id="liteCdb" href="https://rd-svt.github.io/Can-Database-CDB2/">← CDB</a></div>
  </header>
  <div class="l-list"></div>
</main>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script>
  window.addEventListener('error', e => {
    const m = document.getElementById('ldMsg');
    if (m && !document.getElementById('loading').classList.contains('done')) m.textContent = 'โหลดโมเดลไม่สำเร็จ: ' + (e.message || 'unknown error');
  });
</script>
<script type="text/plain" id="m3d">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const $ = s => document.querySelector(s);
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
let dirty = true;                       // render on demand: set when the picture must change
const invalidate = () => { dirty = true; };

/* ---------------- renderer / scene ---------------- */
const canvas = $('#c');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
} catch (e) {
  $('#ldMsg').textContent = 'เบราว์เซอร์นี้ไม่รองรับ WebGL จึงแสดงโมเดล 3D ไม่ได้';
  throw e;
}
const PHONE = matchMedia('(max-width:760px), (pointer:coarse)').matches;
renderer.setPixelRatio(Math.min(window.devicePixelRatio, PHONE ? 1.5 : 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;

const camera = new THREE.PerspectiveCamera(36, 1, 0.03, 60);
camera.position.set(2.2, 1.45, 3.3);
const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 0.95, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 0.35;
controls.maxDistance = 7;
controls.maxPolarAngle = Math.PI * 0.495;
controls.autoRotateSpeed = 0.6;
controls.addEventListener('change', invalidate);

/* ---------------- lights ---------------- */
scene.add(new THREE.HemisphereLight(0xf2f6fa, 0x5d6266, 0.55));
const sun = new THREE.DirectionalLight(0xffffff, 1.9);
sun.position.set(2.6, 4.6, 3.6);
sun.castShadow = true;
sun.shadow.mapSize.set(PHONE ? 1024 : 2048, PHONE ? 1024 : 2048);
Object.assign(sun.shadow.camera, { left: -2, right: 2, top: 2.6, bottom: -1, near: 0.5, far: 12 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
scene.add(sun);

function ctex(w, h, draw, opts = {}) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); draw(g, w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = opts.linear ? THREE.NoColorSpace : THREE.SRGBColorSpace;
  t.anisotropy = maxAniso;
  if (opts.repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...opts.repeat); }
  return t;
}

/* ---------------- geometry helpers ---------------- */
function B(x0, x1, y0, y1, z0, z1, mat, parent, r = 0) {
  const w = x1 - x0, h = y1 - y0, d = z1 - z0;
  const rr = Math.min(r, w / 2 - 1e-4, h / 2 - 1e-4, d / 2 - 1e-4);
  const g = rr > 0.0005 ? new RoundedBoxGeometry(w, h, d, 2, rr) : new THREE.BoxGeometry(w, h, d);
  const m = new THREE.Mesh(g, mat);
  m.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
  parent.add(m); return m;
}
function Cyl(r, h, x, y, z, mat, parent, axis = 'y', seg = 32, r2 = r) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r2, r, h, seg), mat);
  m.position.set(x, y, z);
  if (axis === 'z') m.rotation.x = Math.PI / 2;
  if (axis === 'x') m.rotation.z = Math.PI / 2;
  parent.add(m); return m;
}
function Plane(w, h, mat, parent, x, y, z, ry = 0) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
  m.position.set(x, y, z); m.rotation.y = ry; parent.add(m); return m;
}
function tube(points, r, mat, parent) {
  const curve = new THREE.CatmullRomCurve3(points.map(p => new THREE.Vector3(...p)));
  const m = new THREE.Mesh(new THREE.TubeGeometry(curve, 48, r, 8, false), mat);
  parent.add(m); return m;
}

function updateVending(dt) {
  for (let i = vending.length - 1; i >= 0; i--) {
    const v = vending[i]; v.t += dt;
    let t = v.t, seg = 0;
    while (seg < v.durs.length && t > v.durs[seg]) { t -= v.durs[seg]; seg++; }
    if (seg < v.durs.length) {
      const u = t / v.durs[seg], e = seg === 0 ? u * u : u;
      v.can.position.lerpVectors(v.pts[seg], v.pts[seg + 1], e);
      if (seg > 0) v.can.rotation.x -= dt * 9;
    } else v.can.position.copy(v.pts[v.pts.length - 1]);
    const rem = v.life - v.t;
    if (rem < 0.6) v.can.material.opacity = Math.max(0, rem / 0.6);
    if (rem <= 0) { vm.remove(v.can); v.can.material.dispose(); vending.splice(i, 1); }
  }
}

    _proj.copy(_w).project(camera);
    if (_proj.z > 1) show = false;
    const target = show ? 1 : 0;
    p.vis += (target - p.vis) * 0.25;
    if (Math.abs(target - p.vis) > 0.01) moving = true; else p.vis = target;
    const x = (_proj.x * 0.5 + 0.5) * w, y = (-_proj.y * 0.5 + 0.5) * h;

    p.pin.style.pointerEvents = p.vis > 0.5 ? 'auto' : 'none';

  if (+getComputedStyle(pe).opacity > 0.5 && pr.width) { if (pr.top > h * 0.3) Bt = Math.min(Bt, pr.top); else L = Math.max(L, pr.right); }
  const tx = w / 2 - (L + Rr) / 2, ty = h / 2 - (T + Bt) / 2;
  _off.x += (tx - _off.x) * k; _off.y += (ty - _off.y) * k;
  if (Math.abs(_off.x) < 0.5 && Math.abs(_off.y) < 0.5) camera.clearViewOffset();
  else camera.setViewOffset(w, h, Math.round(_off.x), Math.round(_off.y), w, h);
  return Math.abs(tx - _off.x) > 0.5 || Math.abs(ty - _off.y) > 0.5;
}
let pinsMoving = true, wasIdle = false;
function tick() {
  requestAnimationFrame(tick);
  let dt = Math.min(clock.getDelta(), 0.1);
  if (wasIdle) dt = 1 / 60;                       // no time jump after a pause
  const k = 1 - Math.exp(-dt * (reduceMotion ? 30 : 2.8));
  const doorMoving = Math.abs(S.doorT - S.door) > 1e-3 || Math.abs(S.innerT - S.inner) > 1e-3;
  if (doorMoving) {
    S.door += (S.doorT - S.door) * k;
    S.inner += (S.innerT - S.inner) * k;
  } else { S.door = S.doorT; S.inner = S.innerT; }
  doorPivot.rotation.y = -smooth(Math.min(1, Math.max(0, S.door))) * DOOR_MAX;
  innerPivot.rotation.y = -smooth(Math.min(1, Math.max(0, S.inner))) * INNER_MAX;
  cabLight.intensity = S.door * 1.1;
  mrLight.intensity = S.door * 0.5;
  const flying = !!fly;
  if (fly) {
    fly.u = Math.min(1, fly.u + dt / fly.dur);
    const e = fly.u < 0.5 ? 4 * fly.u ** 3 : 1 - (-2 * fly.u + 2) ** 3 / 2;
    camera.position.lerpVectors(fly.p0, fly.p1, e);
    controls.target.lerpVectors(fly.t0, fly.t1, e);
    if (fly.u >= 1) fly = null;
  }
  const vendingNow = vending.length > 0;
  updateVending(dt);
  const offMoving = frameFree(1 - Math.exp(-dt * 8));
  const orbit = controls.update();
  if (dirty || orbit || flying || doorMoving || vendingNow || offMoving || pinsMoving || controls.autoRotate) {
    renderer.render(scene, camera);
    pinsMoving = updatePins();
    dirty = false; wasIdle = false;
    if (first) { first = false; $('#loading').classList.add('done'); }
  } else wasIdle = true;                          // nothing changed: skip the frame (saves battery)
}
tick();
